<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- The page sends the plan nowhere: it is written and downloaded in the browser. The
       policy names no connect-src, so a request added by mistake is blocked, not sent.
       `frame-ancestors` is ignored in a meta tag, so clickjacking is not covered here. -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'none';
    script-src 'self';
    style-src 'self';
    img-src 'self' data:;
    form-action 'none';
    base-uri 'none';
    object-src 'none'" />
  <meta name="referrer" content="no-referrer" />
  <title>IT:U data management plan</title>
  <meta name="description" data-i18n-attr="content:meta.description"
        content="A short data management plan template for projects at IT:U: the project, its datasets and the fifteen questions of Science Europe’s core requirements, downloaded as a document and as a machine-actionable dmp.json." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%236d4aff'/%3E%3Ctext x='16' y='21' font-size='11' text-anchor='middle' fill='%23ffffff' font-family='monospace' font-weight='bold'%3EDMP%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="./style.css?v=1" />
  <script src="./src/theme-boot.js?v=1"></script>
</head>
<body>
  <div class="app" id="app">
    <aside class="rail" id="rail">
      <div class="brand-mark">
        <span class="brand-glyph" aria-hidden="true"></span>
        <div>
          <p class="brand-name">Data management plan</p>
          <p class="brand-sub">IT:U · DART</p>
        </div>
      </div>
      <p class="nav-label" data-i18n="nav.label">View</p>
      <nav class="nav" aria-label="View" data-i18n-attr="aria-label:nav.label">
        <button class="nav-item" data-view="plan" type="button" aria-pressed="true"><span data-i18n="nav.plan">Write the plan</span></button>
        <button class="nav-item" data-view="about" type="button" aria-pressed="false"><span data-i18n="about.title">About</span></button>
      </nav>
      <div class="rail-spacer"></div>
      <div class="rail-foot">
        <p class="sig">
          <span data-i18n="foot.team">DART · IT:U Interdisciplinary Transformation University Austria</span><br />
          <span data-i18n="foot.licence">Code under MIT, texts under CC BY 4.0</span><br />
          <span id="version">0.1.0</span>
        </p>
      </div>
    </aside>

    <div class="main">
      <div class="cmdbar">
        <h1 class="cmd-title" id="cmd-title" data-i18n="nav.plan">Write the plan</h1>
        <span class="spacer"></span>
        <nav class="langs" id="lang" aria-label="Language" data-i18n-attr="aria-label:ui.lang.aria" hidden></nav>
        <button class="icon-btn" id="theme" type="button" aria-label="Toggle light/dark theme"
                data-i18n-attr="title:ui.theme.title;aria-label:ui.theme.aria">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a6.6 6.6 0 0 0 9.8 9.8Z" /></svg>
        </button>
      </div>

      <main class="content">
        <div class="content-inner">

          <section class="view" data-view="plan">
            <p class="eyebrow" data-i18n="ui.eyebrow">Data management plan</p>
            <p class="lede" data-i18n-html="ui.lede"></p>

            <div class="toolbar" id="toolbar">
              <label class="btn file-btn"><span data-i18n="plan.import">Open a dmp.json</span>
                <input type="file" id="import-file" accept=".json,application/json" /></label>
              <span class="validity" id="import-status" aria-live="polite"></span>
              <span class="spacer"></span>
              <button class="btn danger-quiet" id="new-plan" type="button" data-i18n="plan.new">Start over</button>
            </div>
            <p class="hint toolbar-hint" data-i18n="plan.import.hint"></p>

            <section class="panel" id="meta">
              <h2 class="panel-title" data-i18n="plan.meta.title">About the plan</h2>
              <div class="grid2">
                <label class="field span2"><span data-i18n="plan.title.label">Title of the plan</span>
                  <input class="input" data-bind="title" autocomplete="off"
                         data-i18n-attr="placeholder:plan.title.ph" placeholder="Data Management Plan for …" /></label>
                <label class="field"><span data-i18n="plan.contact.label">Contact person</span>
                  <input class="input" data-bind="contact.name" autocomplete="off" /></label>
                <label class="field"><span data-i18n="plan.mbox.label">Contact e-mail</span>
                  <input class="input" data-bind="contact.mbox" type="email" autocomplete="off" /></label>
                <label class="field"><span data-i18n="plan.orcid.label">Contact ORCID iD</span>
                  <input class="input" data-bind="contact.contact_id.identifier" autocomplete="off" spellcheck="false"
                         data-i18n-attr="placeholder:plan.orcid.ph" placeholder="0000-0000-0000-0000" /></label>
                <label class="field"><span data-i18n="plan.ethics.label">Are there ethical issues?</span>
                  <select class="input" data-bind="ethical_issues_exist" id="ethics"></select></label>
                <p class="hint span2" data-i18n="plan.contact.hint"></p>
              </div>
            </section>

            <section class="panel" id="project">
              <h2 class="panel-title" data-i18n="plan.project.title">Project and funding</h2>
              <div class="grid2">
                <label class="field span2"><span data-i18n="plan.project.label">Project title</span>
                  <input class="input" data-bind="project.0.title" autocomplete="off" /></label>
                <label class="field"><span data-i18n="plan.start.label">Start</span>
                  <input class="input" type="date" data-bind="project.0.start" /></label>
                <label class="field"><span data-i18n="plan.end.label">End</span>
                  <input class="input" type="date" data-bind="project.0.end" /></label>
                <label class="field"><span data-i18n="plan.funder.label">Funder ID</span>
                  <input class="input" data-bind="project.0.funding.0.funder_id.identifier" autocomplete="off" spellcheck="false"
                         data-i18n-attr="placeholder:plan.funder.ph" /></label>
                <label class="field"><span data-i18n="plan.grant.label">Grant number</span>
                  <input class="input" data-bind="project.0.funding.0.grant_id.identifier" autocomplete="off" spellcheck="false"
                         data-i18n-attr="placeholder:plan.grant.ph" /></label>
                <label class="field"><span data-i18n="plan.status.label">Funding status</span>
                  <select class="input" data-bind="project.0.funding.0.funding_status" id="funding-status"></select></label>
              </div>
            </section>

            <div class="reqs-head">
              <h2 class="panel-title" data-i18n="plan.datasets.title">Datasets</h2>
              <span class="muted mono" id="ds-count"></span>
            </div>
            <p class="hint ds-lede" data-i18n="plan.datasets.lede"></p>
            <div id="datasets"></div>
            <div class="toolbar">
              <button class="btn" id="add-dataset" type="button" data-i18n="plan.datasets.add">Add a dataset</button>
            </div>

            <div class="reqs-head">
              <h2 class="panel-title" data-i18n="plan.questions.title">The fifteen questions</h2>
              <span class="muted mono" id="q-count"></span>
            </div>
            <div id="questions"></div>

            <section class="panel finish">
              <div class="validity" id="validity" aria-live="polite"></div>
              <div class="validity" id="completeness"></div>
              <ul class="problems" id="problems" hidden></ul>
              <div class="toolbar">
                <button class="btn btn-primary" id="dl-md-he" type="button" data-i18n="plan.dl.mdHe">Download the plan in Horizon Europe sections (.md)</button>
                <button class="btn" id="dl-md" type="button" data-i18n="plan.dl.md">Download the plan in Science Europe sections (.md)</button>
                <button class="btn" id="dl-json" type="button" data-i18n="plan.dl.json">Download dmp.json</button>
              </div>
            </section>
          </section>

          <section class="view prose" data-view="about" hidden>
            <p data-i18n-html="about.p1"></p>
            <p data-i18n-html="about.p2"></p>
            <p data-i18n-html="about.p3"></p>
          </section>

        </div>
      </main>
    </div>
  </div>
  <script type="module" src="./src/app.js?v=1"></script>
</body>
</html>
